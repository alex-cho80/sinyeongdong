name: Validate dashboard
on:
  push:
    branches:
      - fix/detail-address-verification
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: dashboard-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit inventory regression checks
        run: node tests/unit-inventory.mjs
      - name: Build Worker and client
        run: pnpm build
  sonar-report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public SonarCloud findings
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url = "https://sonarcloud.io/api/issues/search?componentKeys=alex-cho80_sinyeongdong&pullRequest=2&resolved=false&ps=100"
          with urllib.request.urlopen(url, timeout=45) as response:
              report = json.load(response)
          for issue in report.get("issues", []):
              print(json.dumps({key: issue.get(key) for key in ("key", "rule", "severity", "type", "component", "line", "message")}, ensure_ascii=False))
          print("Total issues:", report.get("total"))
          PY
