name: Validate dashboard
on:
  push:
    branches:
      - fix/detail-address-verification
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: dashboard-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit inventory regression checks
        run: node tests/unit-inventory.mjs
      - name: Build Worker and client
        run: pnpm build
